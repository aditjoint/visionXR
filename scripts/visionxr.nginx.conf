# VisionXR Sovereign Surveillance & Behavioral AI Engine
# Sector 22 Sovereign Binding (127.0.0.22 / visionxr.adamconsult.com)

server {
    listen 127.0.0.22:80;
    server_name visionxr.adamconsult.com;

    client_max_body_size 250M;

    location / {
        proxy_pass http://127.0.0.1:8022;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Low-latency WebSockets & Streaming Fan-out support
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
        proxy_buffering off;
    }
}
